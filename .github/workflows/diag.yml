name: Diagnostico

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          probe() {
            echo "### $1" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$2" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          }
          for ep in "GET actions/permissions" "GET pages"; do
            path=${ep#GET }
            code=$(curl -s -o /tmp/out -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/$path")
            probe "$ep -> $code" "$(cat /tmp/out)"
          done
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          probe "POST pages -> $code" "$(cat /tmp/out)"
