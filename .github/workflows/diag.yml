name: Diagnostico

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "token scopes/perm probe"
          curl -s -o /tmp/r1 -w "GET actions/permissions -> %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/permissions"
          cat /tmp/r1; echo
          curl -s -o /tmp/r2 -w "GET pages -> %{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          cat /tmp/r2; echo
          curl -s -o /tmp/r3 -w "POST pages -> %{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"build_type":"workflow"}' \
            "https://api.github.com/repos/${{ github.repository }}/pages"
          cat /tmp/r3; echo
